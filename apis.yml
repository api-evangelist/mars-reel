name: Mars Reel
description: >-
  Mars Reel (Mars Reel Media Corp) is a Los Angeles-based youth sports media and
  streaming company producing original basketball and soccer documentary series,
  athlete training content, and original episodic shows (The Vault, Like Mike,
  Game City). Its Mars Club membership provides premium on-demand video, and its
  TFIOM (The Future Is On Mars) label runs a Shopify fashion storefront. Mars Reel
  is a 500 Global portfolio company operating consumer web and streaming products.
  As of this enrichment pass it publishes no public API, developer portal, OpenAPI
  specification, or technical documentation; this profile captures its public
  identity and consumer link surface only.
